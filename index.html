<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privatekonomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121a15;--bg2:#0e1511;--ink:#efe7d4;--ink2:#d9d1bd;--muted:#9a9483;--faint:#6f6a5c;
  --brass:#c2a566;--brass2:#d6bb7a;--line:rgba(194,165,102,.34);--line2:rgba(194,165,102,.16);
  --pos:#b3cf9f;--neg:#dd9277;--track:rgba(239,231,212,.1);
  --serif:'Cormorant Garamond',Georgia,serif;--text:'EB Garamond',Georgia,serif;
  --photo-d:url('https://pontusdaahl.github.io/Privatekonomi/bg-desktop.jpg');
  --photo-m:url('https://pontusdaahl.github.io/Privatekonomi/bg-mobile.jpg');
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26302a;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
input,select,button,textarea{font-family:inherit;font-size:inherit;}
input::placeholder,textarea::placeholder{color:var(--faint);font-style:italic;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass) !important;}
select option{background:var(--bg2);color:var(--ink);}
input[type="date"]{color-scheme:dark;}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;display:none;}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;opacity:0;position:absolute;right:0;width:36px;height:100%;}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Typografi */
.num{font-family:var(--serif);font-weight:600;font-variant-numeric:lining-nums tabular-nums;line-height:1.1;}
.lab{font-size:15px;color:var(--brass);}
.note{font-size:14px;color:var(--muted);font-style:italic;}
.pos{color:var(--pos);}.neg{color:var(--neg);}
.h{font-family:var(--serif);font-size:25px;font-weight:600;text-align:center;margin:0 0 18px;}
.h::after{content:'';display:block;width:56px;height:1px;background:var(--brass);margin:8px auto 0;}
.h small{font-family:var(--text);font-size:14px;font-weight:400;font-style:italic;color:var(--muted);}
.sublab{font-size:14px;color:var(--brass);margin:18px 0 4px;}
.empty{padding:18px 0;text-align:center;font-size:15px;color:var(--muted);font-style:italic;}

/* Formulär och knappar */
.inp{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:3px;padding:10px 12px;color:var(--ink);font-size:17px;}
.inp.mini{width:78px;padding:3px 7px;font-size:15px;text-align:right;}
.inp.big{font-variant-numeric:lining-nums;font-family:var(--serif);font-size:28px;font-weight:600;padding:8px 12px;}
.btn{background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink2);padding:9px 14px;font-size:16px;cursor:pointer;}
.btn.on{background:rgba(194,165,102,.14);border-color:var(--brass);color:var(--brass2);}
.btn-primary{width:100%;background:var(--brass);border:1px solid var(--brass);border-radius:3px;color:#17140c;padding:12px;font-size:17px;font-weight:600;cursor:pointer;}
.btn-primary:active{background:var(--brass2);}
.btn-add{background:none;border:1px solid var(--line);border-radius:3px;color:var(--brass2);width:44px;flex-shrink:0;font-size:22px;cursor:pointer;}
.del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:20px;flex-shrink:0;padding:0 4px;}
.field{margin-bottom:14px;}.field .lab{display:block;margin-bottom:5px;}
.seg{display:flex;gap:8px;}.seg .btn{flex:1;padding:9px 4px;}

/* Omslag med foto */
.hero{position:relative;text-align:center;padding:18px 28px 34px;
  background:linear-gradient(180deg,rgba(18,26,21,.25) 0%,rgba(18,26,21,.6) 62%,var(--bg) 100%),var(--photo-d) center 38%/cover no-repeat;}
.hero-top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 34px;}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);}
.link-btn{background:rgba(14,21,17,.45);border:1px solid var(--line);border-radius:3px;color:var(--brass2);padding:6px 12px;font-size:15px;cursor:pointer;}
.hero .lab{color:var(--brass2);}
.hero .num{font-size:54px;margin-top:2px;}

/* Flikar (dator) */
.tabs{display:flex;justify-content:center;gap:34px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto;}
.tabs button{background:none;border:none;border-bottom:1px solid transparent;margin-bottom:-1px;padding:12px 2px;color:var(--muted);font-family:var(--serif);font-size:20px;font-weight:600;cursor:pointer;}
.tabs button.on{color:var(--brass2);border-bottom-color:var(--brass);}
#main-wrap{max-width:1100px;margin:0 auto;padding:28px;}

/* Liggare – siffror i rutnät med tunna linjer */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:40px;}
.ledger.two{grid-template-columns:1fr 1fr;}
.ledger.three{grid-template-columns:repeat(3,1fr);}
.ledger>div{padding:16px 18px;border-right:1px solid var(--line);}
.ledger>div:last-child{border-right:none;}
.ledger .num{font-size:32px;margin-top:2px;}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px 56px;margin-bottom:40px;align-items:start;}
.month{display:flex;align-items:center;justify-content:center;gap:28px;}
.month .m{font-family:var(--serif);font-size:26px;font-weight:600;min-width:200px;text-align:center;text-transform:capitalize;}
.circ{width:40px;height:40px;border-radius:50%;background:none;border:1px solid var(--line);color:var(--brass);font-size:20px;cursor:pointer;line-height:1;}
.bar{height:3px;border-radius:2px;background:var(--track);overflow:hidden;}
.bar>div{height:100%;border-radius:2px;}
.line-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);}
.line-row>span:first-child{color:var(--ink2);}
.item-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);}
.item-row .inp{background:transparent;border-color:transparent;padding:6px 4px;}
.item-row .inp:hover{border-color:var(--line2);}
.item-row .val{width:140px;flex-shrink:0;text-align:right;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:lining-nums tabular-nums;}

/* PIN */
#pin-screen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(14,21,17,.55),rgba(14,21,17,.92)),var(--photo-d) center/cover no-repeat;}
#pin-box{text-align:center;width:min(320px,90vw);}
#pin-dots{display:flex;justify-content:center;gap:18px;margin:26px 0 30px;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--brass);transition:background .15s;}
.pin-dot.filled{background:var(--brass);}
#pin-grid{display:grid;grid-template-columns:repeat(3,72px);gap:16px 26px;justify-content:center;}
.pin-btn{width:72px;height:72px;border-radius:50%;background:rgba(14,21,17,.5);border:1px solid var(--line);
  font-family:var(--serif);font-size:30px;font-weight:600;font-variant-numeric:lining-nums;color:var(--ink);cursor:pointer;transition:background .12s;padding:0;}
.pin-btn:active{background:rgba(194,165,102,.22);}
#pin-error{color:var(--neg);font-size:15px;height:20px;margin-top:16px;font-style:italic;}

/* FIRE-reglage */
input[type=range].fire-sl{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--track);outline:none;cursor:pointer;border:none;display:block;margin:10px 0 0;}
input[type=range].fire-sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brass);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--brass);cursor:pointer;}
input[type=range].fire-sl::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brass);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--brass);cursor:pointer;}
input[type=range].fire-sl::-moz-range-track{height:3px;border-radius:2px;background:var(--track);}
input[type=range].fire-sl::-moz-range-progress{height:3px;border-radius:2px;background:var(--brass);}

/* Bottenmeny (mobil) */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--line);padding:6px 0 env(safe-area-inset-bottom,6px);}
#bottom-nav button{flex:1;background:none;border:none;color:#867f6e;cursor:pointer;padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:58px;}
#bottom-nav button.bnav-active{color:var(--brass2);}
#bottom-nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;}

@media(max-width:700px){
  #bottom-nav{display:flex;}
  .hero{padding:14px 16px 26px;background:linear-gradient(180deg,rgba(18,26,21,.15) 0%,rgba(18,26,21,.55) 60%,var(--bg) 100%),var(--photo-m) center 30%/cover no-repeat;}
  .hero-top{margin-bottom:30px;}
  .hero .num{font-size:44px;}
  #pin-screen{background:linear-gradient(180deg,rgba(14,21,17,.5),rgba(14,21,17,.92)),var(--photo-m) center/cover no-repeat;}
  .tabs{display:none;}
  #main-wrap{padding:16px 18px 96px;}
  .ledger,.ledger.two,.ledger.three{grid-template-columns:1fr 1fr;}
  .ledger>div{padding:14px 12px 14px 2px;border-right:none;}
  .ledger>div:nth-child(odd){border-right:1px solid var(--line);}
  .ledger>div:nth-child(even){padding-left:14px;}
  .ledger>div:nth-child(-n+2):not(:nth-last-child(-n+2)){border-bottom:1px solid var(--line);}
  .ledger.three>div:first-child{border-bottom:none;}
  .ledger.three>div:last-child{grid-column:1/-1;border-right:none;padding-left:2px;border-top:1px solid var(--line);}
  .ledger .num{font-size:28px;}
  .ledger.fire .num{font-size:24px;}
  .month{gap:12px;justify-content:space-between;}
  .month .m{min-width:0;font-size:24px;}
  .cols{gap:8px;margin-bottom:28px;}
  .item-row .val{width:118px;font-size:18px;}
}
</style>
</head>
<body>
<div id="pin-screen">
  <div id="pin-box">
    <div style="font-family:var(--serif);font-size:34px;font-weight:600;">Privatekonomi</div>
    <div class="note" style="font-size:16px;margin-top:2px;">Ange PIN-kod</div>
    <div id="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div id="pin-grid">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" style="opacity:0;pointer-events:none;"></button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="pinClear()" aria-label="Radera" style="background:none;border-color:transparent;font-family:var(--text);font-size:15px;color:var(--muted);">Radera</button>
    </div>
    <div id="pin-error"></div>
  </div>
</div>
<div id="root" style="display:none;"><div class="empty">Laddar…</div></div>
<div id="bottom-nav">
  <button id="bnav-oversikt" onclick="setTab('oversikt')">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
    Översikt
  </button>
  <button id="bnav-transaktioner" onclick="setTab('transaktioner')">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Transaktioner
  </button>
  <button id="bnav-formogenhet" onclick="setTab('formogenhet')">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg>
    Förmögenhet
  </button>
  <button id="bnav-mal" onclick="setTab('mal')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
    FIRE
  </button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PIN_HASH = '3a7bd3e2360a3d29eea436fcfb7e44c735d117c681f5656f8ac';
// Simple hash check - not cryptographic but sufficient for casual protection
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(36);}
const CORRECT = simpleHash('3294');
let pinEntry='';
function pinPress(d){
  if(pinEntry.length>=4)return;
  pinEntry+=d;
  updatePinDots();
  if(pinEntry.length===4){
    if(simpleHash(pinEntry)===CORRECT){
      try{sessionStorage.setItem('pk-unlocked','1');}catch(e){}
      document.getElementById('pin-screen').style.display='none';
      document.getElementById('root').style.display='';
    } else {
      document.getElementById('pin-error').textContent='Fel PIN-kod';
      document.getElementById('pin-box').style.animation='pinShake .4s ease';
      setTimeout(()=>{
        pinEntry='';
        updatePinDots();
        document.getElementById('pin-error').textContent='';
        document.getElementById('pin-box').style.animation='';
      },600);
    }
  }
}
function pinClear(){if(pinEntry.length>0){pinEntry=pinEntry.slice(0,-1);updatePinDots();}}
function updatePinDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    if(d)d.classList.toggle('filled',i<pinEntry.length);
  }
}
// Skip PIN if already unlocked this session
if(sessionStorage.getItem('pk-unlocked')==='1'){
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('root').style.display='';
}

function emptyData(){
  return {transactions:[],assets:[],debts:[],budgets:{},
    fire:{currentAge:'27',expectedReturn:'7',inflation:'2',swr:'4',monthlySaving:null,currentCapital:null,targetAnnualSpend:null}};
}
let DATA=null, TAB='oversikt', TXFILTER='all', TXQ={q:'',cat:'all',period:'month'}, OV={range:'12',cat:'all',inc:true,exp:true,sav:false}, OV_CHART=null, IO_OPEN=false, IO_MODE='export', IMPORT_TEXT='', MSG=null, SAVE_TIMER=null, FIRE_CHART=null;
let MONTH=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
let FORM={type:'expense',amount:'',category:'Bostad',date:MONTH+'-01',note:''};
let ASSETFORM={name:'',value:'',category:'Aktier/fonder'};
let DEBTFORM={name:'',value:''};
const FIRE_DEFAULTS={monthlySpend:29000,expectedReturn:7,monthlySaving:15000,
  bgUrl:'https://pontusdaahl.github.io/Privatekonomi/bg-desktop.jpg',
  bgMobUrl:'https://pontusdaahl.github.io/Privatekonomi/bg-mobile.jpg'};
let FIRE=Object.assign({},FIRE_DEFAULTS);
async function saveFire(){
  // lightweight save on slider move — full save via SPARA button
  const D=derive(MONTH);
  const d={
    currentAge: calcAge(),
    expectedReturn: Number(FIRE.expectedReturn)||7,
    inflation: 2,
    swr: 4,
    monthlySaving: Number(FIRE.monthlySaving)||0,
    targetAnnualSpend: Number(FIRE.monthlySpend)*12||0,
    currentCapital: Number(D.fireCapital)||0
  };
  try{
    await fetch(FIREBASE_URL+'/privatekonomi/fire.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(d)
    });
  }catch(e){console.warn('saveFire failed',e);}
}
async function doSaveFire(){
  const btn=document.getElementById('btn-save-fire');
  const status=document.getElementById('fire-save-status');
  if(btn)btn.textContent='Sparar...';
  if(status){status.textContent='';status.style.color='';}
  const D=derive(MONTH);
  const d={
    currentAge: calcAge(),
    expectedReturn: Number(FIRE.expectedReturn) || 7,
    inflation: 2,
    swr: 4,
    monthlySaving: Number(FIRE.monthlySaving) || 0,
    targetAnnualSpend: Number(FIRE.monthlySpend) * 12 || 0,
    currentCapital: Number(D.fireCapital) || 0
  };
  try{
    const r=await fetch(FIREBASE_URL+'/privatekonomi/fire.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(d)
    });
    if(r.ok){
      if(status){status.textContent='Sparat';status.style.color='var(--pos)';}
      setTimeout(()=>{if(status)status.textContent='';},3000);
    } else {
      if(status){status.textContent='Kunde inte spara ('+r.status+')';status.style.color='var(--neg)';}
    }
  }catch(e){
    if(status){status.textContent='Kunde inte spara: '+e.message;status.style.color='var(--neg)';}
  }
  if(btn)btn.textContent='Spara';
}
async function loadFire(){
  try{
    const r=await fetch(FIREBASE_URL+'/privatekonomi/fire.json');
    if(r.ok){
      const d=await r.json();
      if(d && typeof d.expectedReturn==='number'){
        FIRE.expectedReturn=d.expectedReturn;
        if(typeof d.monthlySaving==='number') FIRE.monthlySaving=d.monthlySaving;
        if(typeof d.targetAnnualSpend==='number') FIRE.monthlySpend=Math.round(d.targetAnnualSpend/12);
        return;
      }
    }
  }catch(e){console.warn('loadFire failed',e);}
}

const DEFAULT_CATS={expense:['Bostad','Mat','Transport','Nöje','Kläder','Övrigt'],income:['Lön','Övrigt']};
const ASSET_CATS=['Aktier/fonder','Sparande','Fastigheter','Fordon','Extra'];
const FIRE_CATS=['Aktier/fonder','Sparande']; // endast likvida tillgångar räknas mot FIRE
const FIREBASE_URL='https://privatekonomi-6ca77-default-rtdb.europe-west1.firebasedatabase.app';
const DB_PATH='/privatekonomi.json';

async function loadData(){
  try{const r=await fetch(FIREBASE_URL+DB_PATH);if(r.ok){const d=await r.json();if(d)return d;}}catch(e){}
  try{const raw=localStorage.getItem('pk-v1');if(raw)return JSON.parse(raw);}catch(e){}
  return emptyData();
}
async function saveData(){
  try{localStorage.setItem('pk-v1',JSON.stringify(DATA));}catch(e){}
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(async()=>{
    try{await fetch(FIREBASE_URL+DB_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});}catch(e){}
  },800);
}

const fmt=v=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0}).format(Math.round(v||0))+' kr';
const fmtNum=v=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0}).format(Math.round(toNum(v,0)));
const toNum=(x,d=0)=>{const n=Number(String(x==null?'':x).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:d;};
function monthLabel(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('sv-SE',{month:'long',year:'numeric'});}
function calcAge(){const b=new Date('1998-08-04'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}

function setTab(tab, pushState=true){
  TAB=tab;
  if(tab==='transaktioner') FORM.date=todayStr();
  if(pushState) history.pushState({tab}, '', '#'+tab);
  render();
}
window.addEventListener('popstate', e=>{
  const tab = (e.state&&e.state.tab) || 'oversikt';
  setTab(tab, false);
});
function updateBottomNav(){
  document.querySelectorAll('#bottom-nav button').forEach(b=>{
    b.classList.toggle('bnav-active', b.id==='bnav-'+TAB);
  });
}

function derive(month){
  const monthTx=DATA.transactions.filter(t=>t.date&&t.date.slice(0,7)===month);
  const S=(arr,p)=>arr.filter(p).reduce((a,t)=>a+(Number(t.amount)||0),0);
  const income=S(monthTx,t=>t.type==='income'),expense=S(monthTx,t=>t.type==='expense'),invested=S(monthTx,t=>t.type==='investment');
  const saved=income-expense,savingsRate=income>0?(saved/income*100):0;
  const totAssets=DATA.assets.reduce((a,x)=>a+toNum(x.value,0),0);
  const totDebts=DATA.debts.reduce((a,x)=>a+toNum(x.value,0),0);
  const netWorth=totAssets-totDebts;
  const fireCapital=DATA.assets.filter(x=>FIRE_CATS.includes(x.category||ASSET_CATS[0])).reduce((a,x)=>a+toNum(x.value,0),0);
  const expByCat={};monthTx.filter(t=>t.type==='expense').forEach(t=>{expByCat[t.category]=(expByCat[t.category]||0)+(Number(t.amount)||0);});
  const year=(month||'').slice(0,4);
  const yearTx=DATA.transactions.filter(t=>t.date&&t.date.slice(0,4)===year);
  const yExpByCat={};yearTx.filter(t=>t.type==='expense').forEach(t=>{yExpByCat[t.category]=(yExpByCat[t.category]||0)+(Number(t.amount)||0);});
  const allExpByCat={};DATA.transactions.filter(t=>t.type==='expense').forEach(t=>{allExpByCat[t.category]=(allExpByCat[t.category]||0)+(Number(t.amount)||0);});
  const yIncome=S(yearTx,t=>t.type==='income'),yExpense=S(yearTx,t=>t.type==='expense'),yInvested=S(yearTx,t=>t.type==='investment');
  const ySaved=yIncome-yExpense,yRate=yIncome>0?(ySaved/yIncome*100):0;
  const allIncome=S(DATA.transactions,t=>t.type==='income'),allExpense=S(DATA.transactions,t=>t.type==='expense'),allInvested=S(DATA.transactions,t=>t.type==='investment');
  const allSaved=allIncome-allExpense,allRate=allIncome>0?(allSaved/allIncome*100):0;
  const allDates=DATA.transactions.map(t=>t.date).filter(Boolean).sort();
  const firstDate=allDates.length?allDates[0]:null;
  return{income,expense,invested,saved,savingsRate,totAssets,totDebts,netWorth,fireCapital,expByCat,
    year,yIncome,yExpense,yInvested,ySaved,yRate,yExpByCat,
    allIncome,allExpense,allInvested,allSaved,allRate,allExpByCat,firstDate,monthTxCount:monthTx.filter(t=>t.type!=='investment').length};
}

const CAT_COLS=['#c2a566','#b3cf9f','#dd9277','#93aab0','#d9d1bd','#a98c6a'];
function card(content,style=''){return`<section style="${style}">${content}</section>`;}
function row(l,v,cls=''){return`<div class="line-row"><span>${l}</span><span class="num ${cls}" style="font-size:20px;">${v}</span></div>`;}
function catBreakdown(e){
  const total=Object.values(e).reduce((a,v)=>a+v,0)||1,entries=Object.entries(e).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return`<div class="empty">Inga utgifter</div>`;
  return entries.map(([cat,amt],i)=>{const col=CAT_COLS[i%CAT_COLS.length],pct=amt/total*100;
    return`<div style="margin-top:12px;"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;"><span style="color:var(--ink2);">${esc(cat)}</span><span style="display:flex;align-items:baseline;gap:10px;"><span>${fmt(amt)}</span><span class="note" style="width:38px;text-align:right;">${Math.round(pct)} %</span></span></div><div class="bar"><div style="width:${Math.max(2,pct)}%;background:${col};"></div></div></div>`;
  }).join('');
}

function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ovMonths(){
  const now=new Date(), cur=ym(now);
  let start;
  if(OV.range==='year') start=now.getFullYear()+'-01';
  else if(OV.range==='all'){ const ds=DATA.transactions.map(t=>t.date).filter(Boolean).sort(); start=ds.length?ds[0].slice(0,7):cur; if(start>cur) start=cur; }
  else start=ym(new Date(now.getFullYear(),now.getMonth()-Number(OV.range)+1,1));
  const out=[];let [y,m]=start.split('-').map(Number);
  while(true){const k=y+'-'+String(m).padStart(2,'0');out.push(k);if(k>=cur||out.length>240)break;m++;if(m>12){m=1;y++;}}
  return out;
}
function ovSeries(){
  const months=ovMonths(), inc={}, exp={};
  months.forEach(k=>{inc[k]=0;exp[k]=0;});
  DATA.transactions.forEach(t=>{const k=(t.date||'').slice(0,7);if(!(k in inc))return;
    if(t.type==='income')inc[k]+=toNum(t.amount,0);
    else if(t.type==='expense'&&(OV.cat==='all'||t.category===OV.cat))exp[k]+=toNum(t.amount,0);});
  return {months,inc:months.map(k=>inc[k]),exp:months.map(k=>exp[k]),sav:months.map(k=>(inc[k]||exp[k])?inc[k]-exp[k]:null)};
}
function renderOvChartSection(){
  const S=ovSeries(), n=S.months.length||1, avg=a=>a.reduce((x,y)=>x+(y||0),0)/n;
  const ranges=[['6','6 mån'],['12','12 mån'],['year','I år'],['all','Allt']].map(([k,l])=>`<button class="btn ${OV.range===k?'on':''}" data-ovr="${k}" style="padding:6px 12px;font-size:15px;">${l}</button>`).join('');

  const expLabel=OV.cat==='all'?'Utgifter':esc(OV.cat);
  return `

      ${tog('inc','Inkomster','#b3cf9f')}${tog('exp',expLabel,'#dd9277')}${tog('sav','Sparat','#c2a566',true)}
    </div>
    <div style="position:relative;width:100%;height:280px;"><canvas id="ov-chart"></canvas></div>
    <div class="note" style="text-align:center;margin-top:10px;">
      Snitt per månad: inkomster ${fmt(avg(S.inc))} · ${expLabel.toLowerCase()} ${fmt(avg(S.exp))}${OV.cat==='all'?` · sparat ${fmt(avg(S.sav))}`:''}
      <br>Tryck på en månad för att visa den ovan.
    </div>
  </section>`;
}
function drawOvChart(){
  const c=document.getElementById('ov-chart');if(!c||typeof Chart==='undefined')return;
  const S=ovSeries();
  const labels=S.months.map(k=>{const [y,m]=k.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('sv-SE',{month:'short'}).replace('.','');return (m===1||k===S.months[0])?[s,String(y)]:s;});
  const sel=S.months.indexOf(MONTH);

    }}});
}

function txPeriodOk(d,p){
  if(p==='all')return true; if(!d)return false;
  const now=new Date(), m=d.slice(0,7), y=now.getFullYear();
  if(p==='month')return m===ym(now);
  if(p==='prev')return m===ym(new Date(y,now.getMonth()-1,1));
  if(p==='3m')return m>=ym(new Date(y,now.getMonth()-2,1));
  if(p==='year')return d.slice(0,4)===String(y);
  if(p==='lastyear')return d.slice(0,4)===String(y-1);
  return true;
}

function renderFormogenhet(D){
  const nwTotal=(D.totAssets+D.totDebts)||1;
  const catOptsFor = (cur) => ASSET_CATS.map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  const grouped = {};
  DATA.assets.forEach(a=>{ const c=a.category||ASSET_CATS[0]; (grouped[c]=grouped[c]||[]).push(a); });
  const assetRows = DATA.assets.length ? ASSET_CATS.filter(c=>grouped[c]&&grouped[c].length).map(c=>{
    const items = grouped[c].slice().sort((x,y)=>(x.name||'').localeCompare(y.name||'','sv'));
    const sum = items.reduce((s,a)=>s+toNum(a.value,0),0);
    const rows = items.map(a=>`
      <div class="item-row">
        <input class="inp" data-asset-name="${a.id}" value="${esc(a.name)}" style="flex:1;min-width:0;">
        <input class="inp val" data-asset-value="${a.id}" value="${esc(fmtNum(a.value))}" inputmode="numeric">
        <button class="del" data-delasset="${a.id}" aria-label="Ta bort">×</button>
      </div>`).join('');
    return `<div style="margin-top:6px;">
      <div class="sublab" style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px;"><span>${esc(c)}</span><span>${fmt(sum)}</span></div>
      ${rows}
    </div>`;
  }).join('') : `<div class="empty">Lägg till en tillgång ovan</div>`;
  const debtRows = DATA.debts.map(a=>`
    <div class="item-row">
      <input class="inp" data-debt-name="${a.id}" value="${esc(a.name)}" style="flex:1;min-width:0;">
      <input class="inp val neg" data-debt-value="${a.id}" value="${esc(fmtNum(a.value))}" inputmode="numeric">
      <button class="del" data-deldebt="${a.id}" aria-label="Ta bort">×</button>
    </div>`).join('') || `<div class="empty">Inga skulder registrerade</div>`;

  return `
  <div class="ledger two">
    <div><div class="lab">Tillgångar</div><div class="num">${fmt(D.totAssets)}</div></div>
    <div><div class="lab">Skulder</div><div class="num neg">${fmt(D.totDebts)}</div></div>
  </div>
  <div style="margin:-22px 0 40px;">
    <div style="display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--track);">
      <div style="width:${D.totAssets/nwTotal*100}%;background:var(--brass);"></div>
      <div style="width:${D.totDebts/nwTotal*100}%;background:var(--neg);"></div>
    </div>
    <div class="note" style="display:flex;justify-content:space-between;margin-top:6px;">
      <span>Tillgångar ${Math.round(D.totAssets/nwTotal*100)} %</span><span>Skulder ${Math.round(D.totDebts/nwTotal*100)} %</span>
    </div>
  </div>
  <div class="cols">
    ${card(`
      <h2 class="h">Tillgångar</h2>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="a-name" class="inp" value="${esc(ASSETFORM.name)}" placeholder="t.ex. sparkonto, bostad" style="flex:1;min-width:0;">
        <input id="a-value" class="inp" value="${esc(ASSETFORM.value)}" placeholder="kr" inputmode="numeric" style="width:120px;flex-shrink:0;text-align:right;">
        <button id="btn-addasset" class="btn-add" aria-label="Lägg till tillgång">+</button>
      </div>
      <select id="a-category" class="inp" style="margin-bottom:8px;">${catOptsFor(ASSETFORM.category)}</select>
      ${assetRows}
    `)}
    ${card(`
      <h2 class="h">Skulder</h2>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="d-name" class="inp" value="${esc(DEBTFORM.name)}" placeholder="t.ex. bolån" style="flex:1;min-width:0;">
        <input id="d-value" class="inp" value="${esc(DEBTFORM.value)}" placeholder="kr" inputmode="numeric" style="width:120px;flex-shrink:0;text-align:right;">
        <button id="btn-adddebt" class="btn-add" aria-label="Lägg till skuld">+</button>
      </div>
      ${debtRows}
    `)}
  </div>`;
}


function renderMal(D){

  const pct=Math.min(100,nw/target*100);
  const ret=FIRE.expectedReturn/100,sav=FIRE.monthlySaving;
  function yrsTo(t){if(nw>=t)return 0;let w=nw,y=0;while(w<t&&y<100){w=w*(1+ret)+sav*12;y++;}return y<100?y:null;}
  const yFire=yrsTo(target);
  const w3=nw*0.03,w4=nw*0.04;
  const pctCol=pct>=100?'var(--pos)':'var(--brass2)';
  return `
  <div id="mal-page">
    <div class="ledger two fire" style="margin-bottom:26px;">
      <div><div class="lab">Frihetsmål</div><div id="mal-fire-num" class="num">${fmt(target)}</div><div id="mal-fire-sub" class="note">${fmt(FIRE.monthlySpend)}/mån · 4 %-regeln</div></div>
      <div><div class="lab">Nuläge</div><div id="mal-nw-num" class="num">${fmt(nw)}</div><div class="note">Aktier, fonder och sparande</div></div>

    <div style="margin-bottom:40px;">

      </div>

        <div id="mal-bar" style="width:${pct}%;background:var(--brass);transition:width .3s;"></div>
      </div>
      <div class="note" style="display:flex;justify-content:space-between;margin-top:8px;">
        <span id="mal-achieved">${fmt(nw)} uppnått</span>
        <span id="mal-remaining">${fmt(Math.max(0,target-nw))} kvar</span>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);text-align:center;color:var(--ink2);">
        <span id="mal-time">${yFire!==null?`Uppskattad tid till FIRE: ca ${yFire} år (${FIRE.expectedReturn} % avkastning, ${fmt(sav)}/mån) · ålder ${calcAge()+yFire}`:'Justera sparande för att nå målet'}</span>
      </div>
    </div>

    <h2 class="h">Uttag i dag</h2>
    <div class="ledger two fire">
      <div><div class="lab">3 %-regeln</div><div id="mal-w3m" class="num">${fmt(w3/12)}<span class="note" style="font-family:var(--text);font-weight:400;"> /mån</span></div><div id="mal-w3y" class="note">${fmt(w3)}/år</div></div>
      <div><div class="lab">4 %-regeln</div><div id="mal-w4m" class="num">${fmt(w4/12)}<span class="note" style="font-family:var(--text);font-weight:400;"> /mån</span></div><div id="mal-w4y" class="note">${fmt(w4)}/år</div></div>
    </div>

    <div class="cols">
      <section>
        <h2 class="h">Inställningar</h2>
        <div style="margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;"><span class="lab">Månadsutgift</span><span id="out-spend" class="num" style="font-size:20px;">${fmt(FIRE.monthlySpend)}</span></div>
          <input type="range" class="fire-sl" id="fire-spend" min="5000" max="150000" step="1000" value="${FIRE.monthlySpend}">
        </div>
        <div style="margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;"><span class="lab">Månadssparande</span><span id="out-sav" class="num" style="font-size:20px;">${fmt(FIRE.monthlySaving)}</span></div>

          <input type="range" class="fire-sl" id="fire-ret" min="1" max="15" step="0.5" value="${FIRE.expectedReturn}">
        </div>
        <button id="btn-save-fire" class="btn-primary" onclick="doSaveFire()" style="margin-top:26px;">Spara</button>
        <div id="fire-save-status" class="note" style="margin-top:8px;text-align:center;height:20px;"></div>

function drawFireChart(D){
  const c=document.getElementById('fire-chart');if(!c||typeof Chart==='undefined')return;
  const nw=D.fireCapital,ret=FIRE.expectedReturn/100,sav=FIRE.monthlySaving;
  const target=(FIRE.monthlySpend*12)/0.04;
  const age=calcAge();
  const labels=[],v1=[],v2=[];let w=nw;
  for(let y=0;y<=20;y++){
    labels.push((age+y)+' år');
    v1.push(Math.round(w));v2.push(Math.round(target));
    w=w*(1+ret)+sav*12;
  }
  const kr=v=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0}).format(v)+' kr';
  const font={family:"'EB Garamond', Georgia, serif",size:14};
  if(FIRE_CHART){FIRE_CHART.destroy();FIRE_CHART=null;}
  FIRE_CHART=new Chart(c,{type:'line',data:{labels,datasets:[
    {label:'Kapital',data:v1,borderColor:'#c2a566',backgroundColor:'rgba(194,165,102,0.08)',borderWidth:2,pointRadius:0,pointHoverRadius:4,fill:true,tension:.25},
    {label:'FIRE-mål',data:v2,borderColor:'#b3cf9f',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:false},
      tooltip:{backgroundColor:'#0e1511',borderColor:'rgba(194,165,102,.4)',borderWidth:1,titleColor:'#d6bb7a',bodyColor:'#efe7d4',titleFont:font,bodyFont:font,padding:10,
        callbacks:{label:ctx=>' '+ctx.dataset.label+': '+kr(ctx.raw)}}
    },
    scales:{
      x:{grid:{display:false},border:{color:'rgba(194,165,102,.34)'},ticks:{color:'#9a9483',font,maxTicksLimit:6}},
      y:{grid:{color:'rgba(194,165,102,.1)'},border:{display:false},ticks:{color:'#9a9483',font,callback:v=>v>=1000000?(v/1000000).toLocaleString('sv-SE',{maximumFractionDigits:1})+' mn':v>=1000?Math.round(v/1000)+' tkr':v}}
    }}});
}

function bindFireEvents(){
  const fmtKr=v=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0}).format(Math.round(v))+' kr';
  function updateInPlace(){
    const nw=derive(MONTH).fireCapital;
    const target=(FIRE.monthlySpend*12)/0.04;
    const pct=Math.min(100,nw/target*100);
    const pctCol=pct>=100?'var(--pos)':'var(--brass2)';
    const ret=FIRE.expectedReturn/100,sav=FIRE.monthlySaving;
    function yrsTo(t){if(nw>=t)return 0;let w=nw,y=0;while(w<t&&y<100){w=w*(1+ret)+sav*12;y++;}return y<100?y:null;}
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
    set('mal-fire-num',fmtKr(target));
    set('mal-fire-sub',fmtKr(FIRE.monthlySpend)+'/mån · 4 %-regeln');
    set('mal-pct',pct.toFixed(1).replace('.',',')+' %');
    set('mal-achieved',fmtKr(nw)+' uppnått');
    set('mal-remaining',fmtKr(Math.max(0,target-nw))+' kvar');
    const yF=yrsTo(target);
    set('mal-time',yF!==null?`Uppskattad tid till FIRE: ca ${yF} år (${FIRE.expectedReturn} % avkastning, ${fmtKr(sav)}/mån) · ålder ${calcAge()+yF}`:'Justera sparande för att nå målet');
    set('mal-w3m',fmtKr(nw*0.03/12));set('mal-w3y',fmtKr(nw*0.03)+'/år');
    set('mal-w4m',fmtKr(nw*0.04/12));set('mal-w4y',fmtKr(nw*0.04)+'/år');
    const bar=document.getElementById('mal-bar');if(bar){bar.style.width=pct+'%';}
    const pctEl=document.getElementById('mal-pct');if(pctEl)pctEl.style.color=pctCol;
    drawFireChart(derive(MONTH));
  }
  ['fire-spend','fire-sav','fire-ret'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.oninput=e=>{
      const keyMap={'fire-spend':'monthlySpend','fire-sav':'monthlySaving','fire-ret':'expectedReturn'};const key=keyMap[id];
      FIRE[key]=parseFloat(e.target.value);
      const outId={'fire-spend':'out-spend','fire-sav':'out-sav','fire-ret':'out-ret'}[id];
      const out=document.getElementById(outId);
      if(out)out.textContent=id==='fire-ret'?FIRE[key].toFixed(1).replace('.',',')+' %':fmtKr(FIRE[key]);
      saveFire(); // async, non-blocking
      updateInPlace();
    };
  });
  drawFireChart(derive(MONTH));
}

function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.tab;
    if (TAB==='transaktioner') { const t=new Date(); FORM.date = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
    render();
  });
  document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{
    const [y,m]=MONTH.split('-').map(Number);
    const d=new Date(y,m-1+Number(b.dataset.month),1);
    MONTH = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    render();
  });
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{ FORM.type=b.dataset.type; FORM.category=(DEFAULT_CATS[FORM.type]||['Övrigt'])[0]; render(); });
  document.querySelectorAll('[data-txf]').forEach(b=>b.onclick=()=>{ TXFILTER=b.dataset.txf; render(); });
  bindTxDelete();
  const tq=document.getElementById('tx-q'); if(tq) tq.oninput=e=>{ TXQ.q=e.target.value; updateTxList(); };
  const tcat=document.getElementById('tx-cat'); if(tcat) tcat.onchange=e=>{ TXQ.cat=e.target.value; updateTxList(); };
  const tper=document.getElementById('tx-period'); if(tper) tper.onchange=e=>{ TXQ.period=e.target.value; updateTxList(); };
  const tclr=document.getElementById('tx-clear'); if(tclr) tclr.onclick=()=>{ TXQ={q:'',cat:'all',period:'month'}; TXFILTER='all'; render(); };
  document.querySelectorAll('[data-ovr]').forEach(b=>b.onclick=()=>{ OV.range=b.dataset.ovr; render(); });
  document.querySelectorAll('[data-ovs]').forEach(b=>b.onclick=()=>{ OV[b.dataset.ovs]=!OV[b.dataset.ovs]; render(); });

  document.querySelectorAll('[data-delasset]').forEach(b=>b.onclick=async()=>{ DATA.assets=DATA.assets.filter(t=>t.id!==b.dataset.delasset); await saveData(); render(); });
  document.querySelectorAll('[data-deldebt]').forEach(b=>b.onclick=async()=>{ DATA.debts=DATA.debts.filter(t=>t.id!==b.dataset.deldebt); await saveData(); render(); });
  document.querySelectorAll('[data-budget]').forEach(inp=>inp.onchange=async(e)=>{
    const cat=inp.dataset.budget; const v=toNum(e.target.value,0);
    DATA.budgets = DATA.budgets||{};
    if(!v) delete DATA.budgets[cat]; else DATA.budgets[cat]=v;
    await saveData(); render();
  });

  const fa=document.getElementById('f-amount'); if(fa) fa.oninput=e=>FORM.amount=e.target.value;
  const fc=document.getElementById('f-category'); if(fc) fc.onchange=e=>FORM.category=e.target.value;
  const fd=document.getElementById('f-date'); if(fd) fd.oninput=e=>FORM.date=e.target.value;
  const fn=document.getElementById('f-note'); if(fn) fn.oninput=e=>FORM.note=e.target.value;
  const btnAdd=document.getElementById('btn-add'); if(btnAdd) btnAdd.onclick=async()=>{
    const amt=toNum(FORM.amount,0);
    if(!amt||amt<=0) return;
    DATA.transactions.unshift({ id:'tx'+Date.now(), type:FORM.type, category:FORM.category, amount:Math.abs(amt), date:FORM.date, note:(FORM.note||'').trim() });
    await saveData();
    FORM.amount=''; FORM.note='';
    render();
  };

  const an=document.getElementById('a-name'); if(an) an.oninput=e=>ASSETFORM.name=e.target.value;
  const av=document.getElementById('a-value'); if(av) av.oninput=e=>ASSETFORM.value=e.target.value;
  const ac=document.getElementById('a-category'); if(ac) ac.onchange=e=>ASSETFORM.category=e.target.value;
  const btnA=document.getElementById('btn-addasset'); if(btnA) btnA.onclick=async()=>{
    const v=toNum(ASSETFORM.value,0); if(!ASSETFORM.name.trim()||!v) return;
    DATA.assets.push({ id:'as'+Date.now(), name:ASSETFORM.name.trim(), value:v, category:ASSETFORM.category||ASSET_CATS[0] });
    await saveData(); ASSETFORM={name:'',value:'',category:ASSETFORM.category}; render();
  };
  document.querySelectorAll('[data-asset-name]').forEach(inp=>inp.onchange=async(e)=>{
    const it=DATA.assets.find(x=>x.id===inp.dataset.assetName); if(it){ it.name=e.target.value.trim()||it.name; await saveData(); render(); }
  });
  document.querySelectorAll('[data-asset-value]').forEach(inp=>inp.onchange=async(e)=>{
    const it=DATA.assets.find(x=>x.id===inp.dataset.assetValue); if(it){ it.value=toNum(e.target.value,it.value); await saveData(); render(); }
  });

  const dn=document.getElementById('d-name'); if(dn) dn.oninput=e=>DEBTFORM.name=e.target.value;
  const dv=document.getElementById('d-value'); if(dv) dv.oninput=e=>DEBTFORM.value=e.target.value;
  const btnD=document.getElementById('btn-adddebt'); if(btnD) btnD.onclick=async()=>{
    const v=toNum(DEBTFORM.value,0); if(!DEBTFORM.name.trim()||!v) return;
    DATA.debts.push({ id:'de'+Date.now(), name:DEBTFORM.name.trim(), value:v });
    await saveData(); DEBTFORM={name:'',value:''}; render();
  };
  document.querySelectorAll('[data-debt-name]').forEach(inp=>inp.onchange=async(e)=>{
    const it=DATA.debts.find(x=>x.id===inp.dataset.debtName); if(it){ it.name=e.target.value.trim()||it.name; await saveData(); render(); }
  });
  document.querySelectorAll('[data-debt-value]').forEach(inp=>inp.onchange=async(e)=>{
    const it=DATA.debts.find(x=>x.id===inp.dataset.debtValue); if(it){ it.value=toNum(e.target.value,it.value); await saveData(); render(); }
  });

  const btnOpenIO = document.getElementById('btn-openio'); if(btnOpenIO) btnOpenIO.onclick=()=>{ IO_OPEN=true; IO_MODE='export'; MSG=null; render(); };
  const backdrop = document.getElementById('io-backdrop'); if(backdrop) backdrop.onclick=(e)=>{ if(e.target.id==='io-backdrop'){ IO_OPEN=false; MSG=null; render(); } };
  const btnCloseIO = document.getElementById('btn-closeio'); if(btnCloseIO) btnCloseIO.onclick=()=>{ IO_OPEN=false; MSG=null; render(); };
  const btnIoExport = document.getElementById('btn-ioexport'); if(btnIoExport) btnIoExport.onclick=()=>{ IO_MODE='export'; MSG=null; render(); };
  const btnIoImport = document.getElementById('btn-ioimport'); if(btnIoImport) btnIoImport.onclick=()=>{ IO_MODE='import'; MSG=null; render(); };
  const btnCopy = document.getElementById('btn-copyjson'); if(btnCopy) btnCopy.onclick=()=>{
    try{ navigator.clipboard.writeText(JSON.stringify(DATA,null,2)); MSG={ok:true,text:'JSON kopierad'}; }catch(e){ MSG={ok:false,text:'Kunde inte kopiera'}; } render();
  };
  const btnDownload = document.getElementById('btn-downloadjson'); if(btnDownload) btnDownload.onclick=()=>{
    try{
      const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='privatekonomi.json'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){}
  };
  const importTextEl = document.getElementById('import-text'); if(importTextEl) importTextEl.oninput=e=>IMPORT_TEXT=e.target.value;
  const btnDoImport = document.getElementById('btn-doimport'); if(btnDoImport) btnDoImport.onclick=async()=>{
    try{
      const parsed = JSON.parse(IMPORT_TEXT);
      DATA = {
        transactions: Array.isArray(parsed.transactions)?parsed.transactions:[],
        assets: Array.isArray(parsed.assets)?parsed.assets:[],
        debts: Array.isArray(parsed.debts)?parsed.debts:[],
        budgets: (parsed.budgets&&typeof parsed.budgets==='object')?parsed.budgets:{},
        fire: { ...emptyData().fire, ...(parsed.fire||{}) },
      };
      await saveData();
      IMPORT_TEXT=''; MSG={ok:true,text:'Data importerad ('+DATA.transactions.length+' poster)'};
    }catch(e){ MSG={ok:false,text:'Kunde inte tolka JSON: '+e.message}; }
    render();
  };
}

(async function init(){
  DATA = await loadData();
  await loadFire();
  FORM.date=todayStr();
  const hash=location.hash.replace('#','');
  if(['oversikt','transaktioner','formogenhet','mal'].includes(hash)) TAB=hash;
  history.replaceState({tab:TAB},'','#'+TAB);
  render();
})();
</script>
</body>
